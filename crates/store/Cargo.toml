[package]
name = "store"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
# Test-only seams (`src/test_support`) are compiled only for this crate's tests or
# when a dependent enables this feature from its `[dev-dependencies]`.
test-support = []

[dependencies]
parking_lot.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt"] }
domain.workspace = true
downloader.workspace = true
library.workspace = true
rusqlite = { workspace = true, features = ["functions", "trace", "hooks"] }
media.workspace = true
marker.workspace = true
uuid = { workspace = true, features = ["serde"] }
tempfile.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree.workspace = true
sha2.workspace = true
password-hash = { version = "0.5", features = ["rand_core"] }
argon2 = { version = "0.5", features = ["std"] }
tracing.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
jobs.workspace = true
# Integration tests are separate crates and cannot see `#[cfg(test)]` items, so the
# package enables its own test-support seam for them.
store = { path = ".", features = ["test-support"] }

[[test]]
name = "store_suite_1"
path = "tests/store_suite_1.rs"

[[test]]
name = "store_suite_2"
path = "tests/store_suite_2.rs"

