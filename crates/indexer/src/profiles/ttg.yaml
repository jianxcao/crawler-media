# TTG（移植自上游项目 sites/configs/ttg.yaml）
id: ttg
framework: nexusphp
render: false
search:
  path: /torrents.php
  query_param: search
list:
  item: "table#torrent_table > tbody > tr[id], table#torrent_table > tr[id]"
fields:
  title:
    selector: 'a[href*="details.php"]'
  enclosure:
    selector: 'a[href*="download.php"]'
    attr: href
  detail:
    selector: "a[href*='details.php']"
    attr: href
  size:
    selector: "td:nth-child(6)"
  seeders:
    selector: "td:nth-child(7)"
  leechers:
    selector: "td:nth-child(8)"
  snatched:
    selector: "td:nth-child(9)"
  upload_time:
    selector: "td:nth-child(5)"
    attr: title
  category:
    selector: "a[href^='?cat=']"
    attr: href
  free:
    selector: "img.pro_free, img.pro_free2up"
  hr:
    selector: ""
rss:
  item: item
  title:
    selector: title
  enclosure:
    selector: enclosure
    attr: url
  id:
    selector: guid
  size:
    selector: enclosure
    attr: length
  seeders:
    selector: seeders
  leechers:
    selector: leechers
  snatched:
    selector: snatched
  upload_time:
    selector: pubDate
  category:
    selector: category
  free:
    selector: free
  hr:
    selector: hr
