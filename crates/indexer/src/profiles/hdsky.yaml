# HDSky（移植自上游项目 sites/configs/hdsky.yaml）
id: hdsky
framework: nexusphp
render: false
search:
  path: /torrents.php
  query_param: search
list:
  item: "table.torrents.progresstable tr"
fields:
  title:
    selector: 'table.torrentname a[href*="details.php"] b span'
  enclosure:
    selector: "form[action*='download.php']"
    attr: action
  detail:
    selector: "a[href*='details.php']"
    attr: href
  size:
    selector: "td:nth-child(5)"
  seeders:
    selector: "a[href*='dllist=1#seeders']"
  leechers:
    selector: "a[href*='dllist=1#leechers']"
  snatched:
    selector: "a[href*='viewsnatches.php'] b, td:nth-child(8)"
  upload_time:
    selector: "td:nth-child(4) span"
    attr: title
  category:
    selector: "td:first-child a[href*='cat=']"
    attr: href
  free:
    selector: "img.pro_free, img.pro_free2up"
  hr:
    selector: "img.hitandrun"
rss:
  item: item
  title:
    selector: title
  enclosure:
    selector: enclosure
    attr: url
  id:
    selector: guid
  size:
    selector: enclosure
    attr: length
  seeders:
    selector: seeders
  leechers:
    selector: leechers
  snatched:
    selector: snatched
  upload_time:
    selector: pubDate
  category:
    selector: category
  free:
    selector: free
  hr:
    selector: hr
