# HDVideo（移植自上游项目 sites/configs/hdvideo.yaml）
id: hdvideo
framework: nexusphp
render: false
search:
  path: /torrents.php
  query_param: search
list:
  item: "table.torrents tr"
fields:
  title:
    selector: "span.tt-name a b"
  enclosure:
    selector: 'a[href*="download.php"]'
    attr: href
  detail:
    selector: "a[href*='details.php']"
    attr: href
  size:
    selector: "td:nth-child(6)"
  seeders:
    selector: "a[href*='dllist=1#seeders']"
  leechers:
    selector: "a[href*='dllist=1#leechers'], td:nth-child(8)"
  snatched:
    selector: "a[href*='viewsnatches.php'] b"
  upload_time:
    selector: "td:nth-child(5) span"
    attr: title
  category:
    selector: "td:nth-child(2) a[href*='cat=']"
    attr: href
  free:
    selector: "img.pro_free, img.pro_free2up"
  hr:
    selector: "img.hitandrun"
rss:
  item: item
  title:
    selector: title
  enclosure:
    selector: enclosure
    attr: url
  id:
    selector: guid
  size:
    selector: enclosure
    attr: length
  seeders:
    selector: seeders
  leechers:
    selector: leechers
  snatched:
    selector: snatched
  upload_time:
    selector: pubDate
  category:
    selector: category
  free:
    selector: free
  hr:
    selector: hr
