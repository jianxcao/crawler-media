# HDArea（REST v1 API 优先，保留 Cookie / RSS 兼容回退）
id: hdarea
framework: api
api_dialect: hdarea_v1
base_url: https://hdarea.club
web_base_url: https://hdarea.club
auth_types:
  - apikey
  - cookie
api_check_in_path: /api/v1/user/signin
render: false
search:
  path: /api/v1/torrents
  query_param: q
  page_size: 100
  page_param: page
  page_start: 0
  category_param: cat
download:
  path: /api/v1/torrents/genDlToken
  method: post_json
  id_param: id
categories:
  movie: ["300", "401", "415", "416", "410", "411", "414", "412", "413", "417"]
  tv: ["402", "403"]
  documentary: ["404"]
  anime: ["405"]
  music: ["406", "408"]
  other: ["407", "409"]
list:
  item: "table.torrents:last-of-type > tbody > tr, table.torrents > tr"
fields:
  title:
    selector: "table.torrentname a b"
  enclosure:
    selector: 'a[href*="download.php"]'
    attr: href
  detail:
    selector: "a[href*='details.php']"
    attr: href
  size:
    selector: "td:nth-child(6)"
  seeders:
    selector: "td:nth-child(7)"
  leechers:
    selector: "td:nth-child(8)"
  snatched:
    selector: "td:nth-child(9)"
  upload_time:
    selector: "td:nth-child(5) > span"
    attr: title
  category:
    selector: "td:nth-child(1) a[href*='cat=']"
    attr: href
  free:
    selector: "img.pro_free, img.pro_free2up"
  hr:
    selector: ""
rss:
  item: item
  title:
    selector: title
  enclosure:
    selector: enclosure
    attr: url
  id:
    selector: guid
  size:
    selector: enclosure
    attr: length
  seeders:
    selector: seeders
  leechers:
    selector: leechers
  snatched:
    selector: snatched
  upload_time:
    selector: pubDate
  category:
    selector: category
  free:
    selector: free
  hr:
    selector: hr
