[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
time = { workspace = true }
httpdate.workspace = true
async-trait = "0.1"
axum = "0.8"
domain.workspace = true
store.workspace = true
downloader.workspace = true
filter.workspace = true
jobs.workspace = true
hooks.workspace = true
indexer.workspace = true
library.workspace = true
marker.workspace = true
media.workspace = true
media-server.workspace = true
cover-generator.workspace = true
image.workspace = true
parking_lot.workspace = true
base64.workspace = true
playback.workspace = true
rusqlite.workspace = true
release.workspace = true
serde.workspace = true
serde_json.workspace = true
subscribe.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "fs", "io-util", "time", "sync", "signal"] }
futures-core = "0.3"
flate2.workspace = true
tar.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
