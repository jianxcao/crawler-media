ureq = { version = "3", features = ["socks-proxy"] }
url.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
sha2.workspace = true
libc.workspace = true

[dev-dependencies]
store = { workspace = true, features = ["test-support"] }
